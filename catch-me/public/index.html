 $('lp').innerHTML=S.players.map((p,i)=>`<div class="pr"><span class="dot" style="background:${C[i%8]}"></span>${p.name}${p.id==me?' (you)':''}${p.id==S.host?' 👑':''}${p.on?'':' · offline'}${KB(p)}</div>`).join('');
 $('st').hidden=!h;$('st').disabled=S.players.length<3;$('lh').textContent=`${S.players.length}/9 joined · need 3+ to start${h?' · tap a map to choose it':' · host picks the map'}`}
function game(){const you=S.players.find(p=>p.id==me),X=you.role=='x',mine=S.turn==me,cur=S.players.find(p=>p.id==S.turn);
 const nx=M.reveal.find(r=>r>S.round);$('info').innerHTML=`${X?'🕶 <b>You are Mr. X</b>':'🕵 <b>Detective</b>'} · Move <b>${S.round}/${M.rounds}</b>${nx?` · Reveal at ${nx}`:''}`;
 $('ban').className=mine?'me':'';$('ban').textContent=S.phase=='over'?'Game over':mine?(X&&!S.fresh?'Move again!':'Your move!'):`${cur?cur.name:''}${cur&&!cur.on?' (offline)':''}…`;
 if(mine&&lastTurn!=S.round+':'+S.turn){navigator.vibrate&&navigator.vibrate(200);center(you.pos)}lastTurn=S.round+':'+S.turn;if(cenKey!=S.code+S.phase){cenKey=S.code+S.phase;center(you.pos)}
 const t=you.tk||{};$('act').innerHTML=`<span>${X?`⬛ ${t.black} black · ✖2 ${t.dbl} double`:`🚕 ${t.taxi} · 🚌 ${t.bus} · 🚇 ${t.metro}`}</span>`+(X&&mine&&S.fresh&&S.left==1&&t.dbl>0&&S.round<=M.rounds-2?'<button id="db" class="pri">Double move ✖2</button>':X&&mine&&!S.fresh?'<span>Double move: 2nd step</span>':'');
 const db=$('db');if(db)db.onclick=()=>tx({t:'double'});
 let di=0;$('pl').innerHTML=S.players.map(p=>{const x=p.role=='x',c=x?'#000':C[(di++)%8];return`<div class="chip ${p.id==S.turn?'on':''} ${p.on?'':'off'}" style="border-color:${x?'#fff':c}">${x?'🕶 ':''}${p.name}${p.id==me?' (you)':''}${p.on?'':' ⚠'}${x?'':`<br>${p.tk.taxi}🚕 ${p.tk.bus}🚌 ${p.tk.metro}🚇`}${KB(p)}</div>`}).join('');
 $('log').innerHTML=Array.from({length:M.rounds},(_,i)=>{const e=S.log[i],r=M.reveal.includes(i+1);return`<div class="lg ${r?'rv':''}">${i+1}${r?'👁':''}<b>${e?IC[e.k]:''}</b>${e&&e.rev?e.rev:''}</div>`}).join('');
 if(S.phase!='play')$('sheet').hidden=true;
 let h='';const P=M.P;
 if(S.trail)h+=`<polyline points="${S.trail.map(n=>P[n].x+','+P[n].y).join(' ')}" fill="none" stroke="#111" stroke-width="7" stroke-dasharray="1 14" stroke-linecap="round"/>`;
 [...new Set(S.legal.map(m=>m.to))].forEach(n=>h+=`<circle class="pulse" cx="${P[n].x}" cy="${P[n].y}" r="32" fill="none" stroke="#ffd60a" stroke-width="7"/>`);
 const xp=S.players.find(p=>p.role=='x');
 if(S.seen&&xp.pos==null){const q=P[S.seen.pos];h+=`<circle cx="${q.x}" cy="${q.y}" r="30" fill="#0003" stroke="#000" stroke-width="4" stroke-dasharray="7 6"/><text x="${q.x}" y="${q.y+10}" text-anchor="middle" font-size="30" font-weight="900">?</text><text x="${q.x}" y="${q.y-40}" text-anchor="middle" class="nm" style="font-size:20px;font-weight:800">Mr. X seen @${S.seen.n}</text>`}
 di=0;S.players.forEach(p=>{if(p.pos==null)return;const q=P[p.pos],x=p.role=='x',c=x?'#000':C[(di++)%8];
  h+=`<circle cx="${q.x}" cy="${q.y-10}" r="26" fill="${c}" stroke="${p.id==me?'#ffd60a':'#fff'}" stroke-width="5"/><text x="${q.x}" y="${q.y-1}" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">${x?'X':p.name[0].toUpperCase()}</text>`});
 $('dyn').innerHTML=h;
 const E=$('end');E.hidden=S.phase!='over';if(S.phase=='over'){const iw=(S.winner=='x')==X;
  E.innerHTML=`<h2>${S.winner=='x'?'🕶 Mr. X wins!':'🕵 Detectives win!'}</h2><p style="font-size:20px">${S.why}</p><p>${iw?'🎉 Your side won!':'Better luck next time.'}</p>`+(S.host==me?'<button class="pri" id="ag">Play again</button>':'<small>Waiting for host…</small>')+'<button id="vm">View map</button><button id="mm">Main menu</button>';
  if($('ag'))$('ag').onclick=()=>tx({t:'again'});$('vm').onclick=()=>E.hidden=true;$('mm').onclick=()=>leave(0)}}
function center(n){const w=$('mapwrap'),p=M.P[n];w.scrollTo({left:p.x*zoom-w.clientWidth/2,top:p.y*zoom-w.clientHeight/2,behavior:'smooth'})}
conn();if('serviceWorker'in navigator&&/^https?:/.test(location.protocol)&&!window.Capacitor)navigator.serviceWorker.register('sw.js');
</script></body></html>
